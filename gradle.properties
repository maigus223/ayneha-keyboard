org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --------------------------------------------------------------------
# JDK utilisé par Gradle (le "Gradle JVM"), PAS le JDK cible du bytecode.
# Gradle 8.7 (voir gradle-wrapper.properties) ne sait pas s'exécuter sur
# un JDK 22+ (ex. JDK 25). Si Android Studio a sélectionné par défaut le
# dernier JDK installé sur ta machine (25, 24...), le sync échoue avec
# "Incompatible Gradle JVM version".
#
# Solution recommandée (aucun fichier à éditer) :
#   File > Settings > Build, Execution, Deployment > Build Tools > Gradle
#   -> "Gradle JDK" -> choisir "Embedded JDK (JetBrains Runtime)"
#   ou un JDK 17/21 installé.
#
# Solution alternative (décommenter et adapter LE CHEMIN À TA MACHINE) :
# org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
#
# ATTENTION : ce chemin est propre à TA machine. Si tu le décommentes,
# NE PARTAGE PAS ce fichier tel quel (voir gradle.properties.local dans
# le .gitignore) ou tes amis auront la même erreur avec un chemin invalide.
# --------------------------------------------------------------------
